[package]
name = "win2lin-verify"
version = "0.1.0"
edition = "2021"
description = "Cross-platform SHA-256 verifier/writer for Win2Lin export bundles (same format as PowerShell tool). Optional accelerator; PowerShell scripts remain primary."
license = "MIT"
readme = "README.md"
rust-version = "1.70"

[dependencies]
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
