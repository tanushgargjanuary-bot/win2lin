      - name: OBS Studio
        method: pacman
        package: "obs-studio"
    notes: "Scene/profile exports may transfer, but plugins, capture sources, device names, and paths often need Linux-specific setup."
    migration:
      strategy: export-import
      data_to_move: ["Scene collections/profiles exported from OBS", "Media assets used by scenes"]
      cautions:
        - "Do not assume Windows capture plugins/devices work on Linux."
        - "Re-test audio devices, screen/window capture, and hardware encoding."
