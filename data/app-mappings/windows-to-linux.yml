  - id: dev-vscode
    windows:
      names: ["Visual Studio Code", "Code.exe", "VS Code"]
      category: dev
    linux_options:
      - name: Visual Studio Code
        method: flatpak
        package: "com.visualstudio.code"
        notes: "Convenient cross-distro install; sandboxing may affect terminal/SDK paths."
      - name: Visual Studio Code
        method: apt
        package: "code"
        notes: "Requires Microsoft repo on Debian/Ubuntu-family systems; verify official instructions."
      - name: Visual Studio Code
        method: dnf
        package: "code"
        notes: "Requires Microsoft repo on Fedora/RHEL-family systems; verify official instructions."
      - name: VSCodium (alternative)
        method: flatpak
        package: "com.vscodium.codium"
        notes: "Community build without Microsoft branding/telemetry defaults; extension marketplace behavior differs."
    notes: "Use Settings Sync or export settings/extensions profile. Reinstall extensions on Linux and verify paths, shells, and SDK locations."
    migration:
      strategy: export-import
      data_to_move: ["Settings Sync account (preferred)", "settings.json/keybindings/snippets exports if used", "Extension list"]
      cautions:
        - "Do not copy secret tokens from settings, tasks, or extension storage."
        - "Windows-specific paths, PowerShell assumptions, and selected interpreters must be reconfigured."

  - id: dev-git
    windows:
      names: ["Git for Windows", "git.exe"]
      category: dev
    linux_options:
      - name: Git
        method: apt
        package: "git"
      - name: Git
        method: dnf
        package: "git"
      - name: Git
        method: pacman
        package: "git"
      - name: Git
        method: nix
        package: "git"
        notes: "For Nix users/profiles; do not auto-reconfigure NixOS system."
    notes: "Git config (`~/.gitconfig`) can usually be restored safely if reviewed. Recreate SSH keys or move them only through secure, user-approved manual steps; Win2Lin restore does not copy private keys."
    migration:
      strategy: config
      data_to_move: [".gitconfig (reviewed)", "Global gitignore if used", "Repository working copies (normal file copy)"]
      cautions:
        - "Never copy private SSH keys, GPG private keys, or credential helper secrets automatically."
        - "Line ending settings may need adjustment (`core.autocrlf`) on Linux."
        - "Re-test commit signing, remotes, and credential helpers after migration."

  - id: dev-nodejs
    windows:
      names: ["Node.js", "node.exe", "npm", "nvm-windows"]
      category: dev
    linux_options:
      - name: Node.js (distro package)
        method: apt
        package: "nodejs"
        notes: "May lag upstream; acceptable for simple needs."
      - name: Node.js (distro package)
        method: dnf
        package: "nodejs"
      - name: Node.js (distro package)
        method: pacman
        package: "nodejs"
      - name: nvm/fnm/volta (version manager)
        method: manual
        package: "nvm | fnm | volta"
        notes: "Preferred when projects require specific Node versions; follow official install docs."
      - name: Node.js via Nix
        method: nix
        package: "nodejs"
        notes: "Useful for reproducible dev environments; user/profile workflow."
    notes: "Do not copy `node_modules`. Reinstall dependencies from lockfiles (`npm ci`, `pnpm install`, `yarn install`) on Linux."
    migration:
      strategy: reinstall
      data_to_move: ["Project source code", "package.json / lockfiles", ".npmrc only after removing tokens/secrets"]
      cautions:
        - "Never copy auth tokens from `.npmrc` or environment secrets."
        - "Native modules may need rebuilds; install build tools as appropriate."

  - id: dev-python
    windows:
      names: ["Python", "python.exe", "py.exe", "pip"]
      category: dev
    linux_options:
      - name: Python 3 (distro package)
        method: apt
        package: "python3 python3-pip python3-venv"
      - name: Python 3 (distro package)
        method: dnf
        package: "python3 python3-pip"
      - name: Python 3 (distro package)
        method: pacman
        package: "python python-pip"
      - name: pyenv/uv/conda (workflow-specific)
        method: manual
        package: "pyenv | uv | conda/mamba"
        notes: "Choose based on project needs; avoid copying Windows virtual environments."
    notes: "Do not copy `.venv`/`venv`. Recreate environments on Linux from `requirements.txt`, `pyproject.toml`, `poetry.lock`, `uv.lock`, etc."
    migration:
      strategy: reinstall
      data_to_move: ["Project source code", "Dependency manifests/lockfiles", "Reviewed pip/uv config without credentials"]
      cautions:
        - "Never copy API keys, `.pypirc` passwords, or private package index credentials."
        - "Some packages have Linux-specific system dependencies (build headers, libraries)."

  - id: dev-go
    windows:
      names: ["Go", "go.exe", "Golang"]
      category: dev
    linux_options:
      - name: Go (distro package)
        method: apt
        package: "golang-go"
        notes: "Version may lag; check project `go.mod` requirements."
      - name: Go (distro package)
        method: dnf
        package: "golang"
      - name: Go (distro package)
        method: pacman
        package: "go"
      - name: Official Go tarball / version manager
        method: manual
        package: "go"
        notes: "Use when you need a specific Go version; follow official install docs."
    notes: "Go modules make reinstall/rebuild straightforward. Keep source and module files; module cache can be rebuilt."
    migration:
      strategy: reinstall
      data_to_move: ["Project source code", "go.mod / go.sum", "Reviewed GOPATH/GOBIN customizations if any"]
      cautions:
        - "Do not copy private module credentials/tokens."
        - "Recreate PATH/GOPATH/bin settings for Linux shell startup files."

  - id: dev-docker
    windows:
      names: ["Docker Desktop", "docker.exe"]
      category: dev
    linux_options:
      - name: Docker Engine
        method: manual
        package: "docker-ce docker-ce-cli containerd.io"
        notes: "Use official Docker docs for your distro; daemon/service setup differs from Docker Desktop."
      - name: Docker Engine (distro package)
        method: apt
        package: "docker.io"
        notes: "May differ from upstream Docker CE; verify features needed."
      - name: Docker Engine (distro package)
        method: dnf
        package: "moby-engine"
        notes: "Fedora package name may be moby-engine; verify."
      - name: Podman (alternative)
        method: apt
        package: "podman"
        notes: "Daemonless alternative; Docker CLI compatibility varies by workflow."
      - name: Podman (alternative)
        method: dnf
        package: "podman"
      - name: Podman (alternative)
        method: pacman
        package: "podman"
    notes: "Docker Desktop concepts (VM, WSL integration, GUI settings) do not map 1:1 to Linux. Recreate Compose files/images; re-pull images where possible."
    migration:
      strategy: reinstall
      data_to_move: ["Dockerfiles", "compose.yml/docker-compose.yml", "Build contexts/source", "Exported non-sensitive config/docs"]
      cautions:
        - "Do not copy secrets from `.env` files, registry auth, or compose overrides without review."
        - "Bind-mount paths and file permissions often need Linux-specific adjustments."
        - "On immutable systems, prefer supported container tooling workflows and manual guidance."

