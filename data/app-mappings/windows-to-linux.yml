# Win2Lin: Windows -> Linux app mapping scaffold (data-driven)
#
# Purpose:
# - Help users find Linux equivalents for common Windows apps during migration.
# - Keep recommendations distro-agnostic where possible and package-manager-aware
#   where relevant (Flatpak, apt, dnf, pacman, nix, etc.).
# - Drive checklists/reports; this file is NOT an installer script.
#
# Safety / scope:
# - No secrets, passwords, tokens, cookies, browser credential stores, or private
#   keys. NEVER instruct users to copy DPAPI-locked browser data.
# - Prefer sync/export/import flows (browser sync, account sign-in, config export).
# - Package names and availability vary by distro/release. Treat linux_options as
#   starting points; verify with the target distro before installing.
# - On immutable/atomic/transactional/declarative systems (Bazzite, Bluefin,
#   Silverblue, MicroOS/Aeon/Kalpa, Vanilla OS/abroot, NixOS, Guix System,
#   SteamOS-managed flows), do not auto-mutate the system. Prefer Flatpak,
#   distrobox/toolbox, or documented manual workflows.
#
# Schema (extensible; unknown fields should be ignored by simple consumers):
# schema_version: 1
# mappings:
#   - id: stable-identifier
#     windows:
#       names: ["Display Name", "exe/process hints"]   # human + matching hints
#       category: browser|dev|utility|communication|office|media|...
#     linux_options:                                   # ordered or grouped suggestions
#       - name: "App Name"
#         method: flatpak|apt|dnf|pacman|nix|appimage|snap|manual|web
#         package: "package-or-ref"                    # optional; distro-specific when method is native PM
#         notes: "short caveat"
#     notes: "general guidance / alternatives"
#     migration:
#       strategy: sync|manual|config|export-import|reinstall|web
#       data_to_move: ["bookmarks HTML (optional)", "settings export"]  # never secrets
#       cautions: ["Do not copy browser passwords/cookies/private keys"]
#
# Contributors: keep entries factual, add cautions, and prefer official sources.
# If a package name is distro-specific, say so in package/notes.

schema_version: 1
updated: "2026-11-08"
mappings:
  - id: browser-brave
    windows:
      names: ["Brave", "brave.exe"]
      category: browser
    linux_options:
      - name: Brave
        method: flatpak
        package: "com.brave.Browser"
        notes: "Good cross-distro option; works well on immutable systems."
      - name: Brave
        method: apt
        package: "brave-browser"
        notes: "Requires Brave's apt repo on Debian/Ubuntu-family systems; follow official instructions."
      - name: Brave
        method: dnf
        package: "brave-browser"
        notes: "Requires Brave's repo on Fedora/RHEL-family systems; follow official instructions."
      - name: Brave
        method: pacman
        package: "brave-bin"
        notes: "Commonly an AUR package; use distro/AUR workflow carefully."
    notes: "Use Brave Sync for bookmarks, extensions, history, and settings where supported. Export bookmarks as HTML as a backup."
    migration:
      strategy: sync
      data_to_move: ["Bookmarks HTML export (optional backup)", "Extension list (review; reinstall from store)"]
      cautions:
        - "Never copy browser passwords, cookies, session data, or DPAPI-locked profile databases."
        - "Re-login on Linux after sync; verify critical accounts."

